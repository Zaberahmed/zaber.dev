name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build web app
        run: "cd apps/web && deno task build"

      - name: Deploy API to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "zaber-api"
          entrypoint: "apps/api/index.ts"
          include: "apps/api, apps/shared"
          exclude: "**/node_modules"

      - name: Deploy Web to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "zaber"
          entrypoint: "apps/web/server.ts"
          include: "./, apps/web, apps/shared"
          exclude: "**/node_modules"
